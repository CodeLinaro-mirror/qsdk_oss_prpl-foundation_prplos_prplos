---
description: Enable kasan debug configs for build

diffconfig: |
  CONFIG_DEBUG=y
  CONFIG_KERNEL_ARM_KERNMEM_PERMS=y
  CONFIG_KERNEL_CC_OPTIMIZE_FOR_SIZE=y
  CONFIG_KERNEL_DEBUG_RODATA=y
  CONFIG_KERNEL_KASAN=y
  CONFIG_KERNEL_QCA_MINIDUMP_DEBUG=y
  CONFIG_KERNEL_SKB_FAST_RECYCLABLE_DEBUG_ENABLE=y
  CONFIG_KERNEL_SLUB_DEBUG=y
  CONFIG_KERNEL_STACKTRACE=y
  CONFIG_STRIP_ARGS="--strip-unneeded --remove-section=.comment --remove-section=.note"
  CONFIG_USE_STRIP=y
