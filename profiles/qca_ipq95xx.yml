diffconfig: |
  CONFIG_TARGET_INITRAMFS_COMPRESSION_LZMA=y
  CONFIG_BUSYBOX_CUSTOM=y
  CONFIG_KERNEL_HWMON=y
  CONFIG_BUSYBOX_CONFIG_USLEEP=y
  CONFIG_BUSYBOX_CONFIG_BLOCKDEV=y
  CONFIG_BUSYBOX_CONFIG_TFTPD=y
  CONFIG_BUSYBOX_CONFIG_FEATURE_TFTP_GET=y
  CONFIG_BUSYBOX_CONFIG_FEATURE_TFTP_PUT=y
  CONFIG_BUSYBOX_CONFIG_TFTP=y
  CONFIG_BUSYBOX_CONFIG_TELNET=y
  CONFIG_BUSYBOX_CONFIG_ARPING=y
  CONFIG_BUSYBOX_CONFIG_DEVMEM=y
  CONFIG_DEBUG=y
  CONFIG_KERNEL_UBIFS_FS_SECURITY=y
  CONFIG_KERNEL_DYNAMIC_DEBUG=y
  # CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set
  CONFIG_WPA_MSG_MIN_PRIORITY=0
  CONFIG_ATH_USER_REGD=y
  CONFIG_KERNEL_CPU_THERMAL=y
  CONFIG_KERNEL_CPU_FREQ_THERMAL=y
  CONFIG_IPERF_ENABLE_MULTICAST=y
  CONFIG_KERNEL_DEBUG_ATOMIC_SLEEP=y
  CONFIG_KERNEL_DEBUG_GPIO=y
  CONFIG_KERNEL_DEVMEM=y
  CONFIG_KERNEL_PERF_EVENTS=y
  # CONFIG_KERNEL_SWAP is not set
  CONFIG_PACKAGE_ATH_DEBUG=y
  CONFIG_PACKAGE_ppecfg=y
  CONFIG_PACKAGE_libnl-ppe=y
  CONFIG_PACKAGE_ppecfg=y
  CONFIG_PACKAGE_libnl-ppe=y
  CONFIG_PACKAGE_mcastd-noforward=n
  CONFIG_PACKAGE_tr181-mcastd=n
  CONFIG_PACKAGE_perf=m
  CONFIG_PACKAGE_libtraceevent=m
  CONFIG_PACKAGE_libunwind=m
  CONFIG_PACKAGE_lldpd=y
  CONFIG_PACKAGE_kmod-qseecom=m
  CONFIG_PACKAGE_samba4-server=m
  CONFIG_PACKAGE_openssh-sftp-server=m
  CONFIG_LOCALMIRROR="https://sources.cdn.openwrt.org/"
  CONFIG_PACKAGE_afc-open=m
  CONFIG_PACKAGE_qca-afc-daemon-open=m
  CONFIG_MAKE_TOOLCHAIN=y
  CONFIG_PACKAGE_softsku_sdk=m
  CONFIG_PACKAGE_softsku_qwin_agent=m
  CONFIG_PACKAGE_wasm-container-interfaces=m
  CONFIG_PACKAGE_package_manager_agent=m
  CONFIG_PACKAGE_unzip=m
  CONFIG_PACKAGE_qti-license-pfm=m
  CONFIG_PACKAGE_pm-utils=m
  CONFIG_PACKAGE_qti-softsku-license-loader-libs=m
