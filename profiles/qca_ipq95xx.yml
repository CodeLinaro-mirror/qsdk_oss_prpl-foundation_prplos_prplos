---
profiles:
  - prpl_freedom
target: ipq95xx
subtarget: generic
external_target: True
description: Build image for prpl Foundation Freedom board

additional_packages:
  - feed: packages
    packages:
      - i2c-tools
      - sysstat
      - u-boot
  - feed: platform_utils
    packages:
      - platform_drivers
      - wififw_mount_script
      - kmod-sound-soc-ipq
      - kmod-usb-phy-ipq807x
      - kmod-usb-dwc3-internal
      - kmod-usb-dwc3-qcom-internal
      - kmod-usb-storage
      - kmod-usb-storage-extras
      - kmod-usb-storage-uas
      - kmod-fs-vfat
  - feed: wlan_utils
    packages:
      - qca-wifi-scripts
      - wifi-scripts
      - ath-legacy-wifi-scripts
  - feed: ssdk
    packages:
      - qca-ssdk
      - qca-ssdk-shell
  - feed: wlan-internal
    packages:
      - kmod-ath12k
      - kmod-mac80211
      - kmod-cfg80211
      - hostapd-common
      - hostapd-utils
      - wpad-mesh-openssl
      - iw-full
      - wireless-freedom
      - netifd-scripts
      - ubus
      - libubox
      - udebug
  - feed: nss_host
    packages:
      - kmod-qca-nss-ppe
      - kmod-qca-nss-ppe-vp
      - kmod-qca-nss-ppe-bridge-mgr
      - kmod-qca-nss-ppe-pppoe-mgr
      - kmod-qca-nss-ppe-lag-mgr
      - kmod-qca-nss-ppe-tunipip6
      - kmod-qca-nss-ppe-gretap
      - kmod-qca-nss-ppe-vxlanmgr
      - kmod-qca-nss-ppe-mapt
      - kmod-qca-nss-ppe-rule
      - kmod-qca-nss-ppe-qdisc
      - kmod-qca-nss-ppe-ds
      - kmod-qca-nss-ppe-mirror-test
      - kmod-qca-nss-ppe-dsa-mgr
      - kmod-qca-nss-dp
      - ppecfg
      - aqr-phy
      - kmod-qca-nss-cfi
      - kmod-qca-nss-ecm
      - kmod-qca-nss-phy
      - kmod-qca-nss-sfe
      - kmod-emesh-sp
      - kmod-qca-nss-clients
      - kmod-qca-nss-ppe-test
      - kmod-qca-ovsmgr
      - kmod-nss-udp-st-drv
      - kmod-qca-nss-crypto
      - kmod-qca-nss-gmac
      - kmod-qca-nss-ppe-capwapmgr
      - kmod-qca-nss-ppe-tun
      - kmod-nss-userspace-oss
      - kmod-qca-nss-ppe-clients
      - kmod-qca-nss-ppe-netlink
      - kmod-qca-nss-netfn
      - kmod-qca-net-standby
      - kmod-qca-nss-nsm
      - kmod-qca-nss-ppe-dtlsmgr
      - kmod-qca8k

packages:
  - e2fsprogs
  - uboot-envtools
  - kmod-leds-gpio
  - kmod-gpio-button-hotplug
  - kmod-button-hotplug
  - kmod-ata-core
  - kmod-ata-ahci
  - kmod-ata-ahci-platform
  - kmod-usb3
  - kmod-ath12k
  - kmod-leds-gpio
  - swconfig
  - kmod-fs-ext4
  - losetup
  - ath-wifi-scripts
  - kmod-bonding
  - wpad-mesh-openssl
  - kmod-pptp
  - kmod-crypto-authenc
  - kmod-qca-nss-dscpstats
  - kmod-qca-nss-eip
  - kmod-qca-nss-eip-crypto
  - kmod-qca-nss-eip-ipsec
  - kmod-qca-nss-macsec
  - kmod-qca-nss-ppe-vlan-mgr
  - kmod-qca-nss-ecm-premium
  - kmod-qca-nss-fls
  - kmod-qca-nss-ecm-wifi-plugin
  - hostapd-utils
  - wireless-regdb
  - qca-ssdk-shell
  - kmod-telemetry-agent
  - kmod-bootconfig
  - wpa-cli
  - ethtool
  - tcpdump
  - taskset

diffconfig: |
  CONFIG_TARGET_INITRAMFS_COMPRESSION_LZMA=y
  CONFIG_BUSYBOX_CUSTOM=y
  CONFIG_TARGET_ipq95xx_generic_DEVICE_qcom_alxx=y
  CONFIG_KERNEL_HWMON=y
  CONFIG_BUSYBOX_CONFIG_USLEEP=y
  CONFIG_BUSYBOX_CONFIG_BLOCKDEV=y
  CONFIG_BUSYBOX_CONFIG_TFTPD=y
  CONFIG_BUSYBOX_CONFIG_FEATURE_TFTP_GET=y
  CONFIG_BUSYBOX_CONFIG_FEATURE_TFTP_PUT=y
  CONFIG_BUSYBOX_CONFIG_TFTP=y
  CONFIG_BUSYBOX_CONFIG_TELNET=y
  CONFIG_DEBUG=y
  CONFIG_KERNEL_UBIFS_FS_SECURITY=y
  CONFIG_KERNEL_DYNAMIC_DEBUG=y
  # CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set
  CONFIG_PACKAGE_ATH_DEBUG=y
  CONFIG_PACKAGE_ppecfg=y
  CONFIG_PACKAGE_libnl-ppe=y
  CONFIG_PACKAGE_mcastd-noforward=n
  CONFIG_PACKAGE_tr181-mcastd=n
